name: ci

on:
  push:
    paths: ['packages/**', 'tests/**', 'pyproject.toml', '.github/workflows/ci.yml']
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: '3.14'

      - name: 装起来
        run: uv sync --all-packages --all-extras

      # F 与 E9 是真错：未定义的名字、引用在赋值之前、语法错。
      # 「局部变量遮蔽同名导入」归 F823——那一条让整条命令挂过一次。
      - name: 静态检查
        run: uv run ruff check packages tests

      - name: 测试
        run: uv run pytest tests -q -rfE

      - name: 命令面在
        run: |
          uv run xirang --help
          uv run ran --help
