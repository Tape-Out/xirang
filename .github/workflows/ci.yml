name: ci

on:
  push:
    paths: ['packages/**', 'tests/**', 'pyproject.toml', '.github/workflows/ci.yml']
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: '3.14'

      - name: 装起来
        run: uv sync

      # F 与 E9 是真错：未定义的名字、引用在赋值之前、语法错。
      # 「局部变量遮蔽同名导入」归 F823——那一条让整条命令挂过一次。
      - name: 静态检查
        run: uv run ruff check packages tests

      - name: 结构
        run: uv run python tests/test_structure.py

      - name: 命令面在
        run: |
          uv run xirang --help
          uv run ran --help
