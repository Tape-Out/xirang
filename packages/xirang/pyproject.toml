[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "xirang"
version = "0.1.0"
description = "XiRang xirang"
requires-python = ">=3.14"
dependencies = ['xirang-core', 'xirang-gen', 'xirang-area', 'xirang-back', 'xirang-out', 'xirang-ws', 'xirang-flow', 'pyyaml']

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
xirang = "xirang.cli:main"
ran = "xirang.cli:main"
