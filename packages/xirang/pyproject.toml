[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "xirang"
version = "0.1.0"
description = "XiRang xirang"
requires-python = ">=3.14"
dependencies = ['xirang-core', 'xirang-gen', 'xirang-area', 'xirang-back', 'xirang-out', 'xirang-ws', 'xirang-flow', 'pyyaml']

# 外部工具一律系统装的优先。装不上的人可以让 pip 带一份兜底：
#   pip install xirang[yosys]
# 找工具时先 which，再找 yowasp-* 那份，所以两者共存也不会打架。
[project.optional-dependencies]
yosys = ["yowasp-yosys"]
fpga = ["yowasp-nextpnr-ice40"]
sv = ["pyslang"]

[tool.setuptools.packages.find]
where = ["src"]

# 模板是包数据：装好之后 ran new 零网络零 git
[tool.setuptools.package-data]
xirang = ["skel/skel.yaml", "skel/common/**/*", "skel/templates/**/*"]

[project.scripts]
xirang = "xirang.cli:main"
ran = "xirang.cli:main"
