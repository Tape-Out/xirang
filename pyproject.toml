# 息壤的工作区。八个包同仓，改动的驱动力各不相同——分包的理由写在
# packages/<包>/pyproject.toml 的 description 里，一句话一个。
[project]
name = "xirang-dev"
version = "0.1.0"
description = "XiRang workspace root"
requires-python = ">=3.14"
dependencies = ["xirang"]

[dependency-groups]
dev = ["ruff>=0.14"]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
xirang = { workspace = true }
xirang-area = { workspace = true }
xirang-back = { workspace = true }
xirang-core = { workspace = true }
xirang-flow = { workspace = true }
xirang-gen = { workspace = true }
xirang-out = { workspace = true }
xirang-ws = { workspace = true }

[tool.ruff]
target-version = "py314"
line-length = 92

[tool.ruff.lint]
# F 与 E9 是真错：未定义的名字、引用在赋值之前、语法错。
# 「局部变量遮蔽同名导入」这个形状归 F823，正是让整条命令挂掉的那一类。
select = ["F", "E9"]
